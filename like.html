<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愛心</title>
<link rel="preconnect" href="https://abacus.jasoncameron.dev" crossorigin>
<style>
  :root { --fg:#37352f; --muted:#8a8780; --line:#d9d6cf; --heart:#e0556b; --tint:rgba(224,85,107,.1); }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e4df; --muted:#9b988f; --line:#4a4843; --tint:rgba(224,85,107,.18); }
  }
  html, body { margin:0; height:100%; background:transparent; }
  body {
    display:flex; align-items:center; justify-content:center;
    font:15px/1.4 -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color:var(--fg);
  }
  button {
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 20px; border-radius:999px;
    border:1px solid var(--line); background:transparent; color:inherit;
    font:inherit; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  button:hover { border-color:var(--heart); }
  button:active { transform:scale(.96); }
  button:focus-visible { outline:2px solid var(--heart); outline-offset:2px; }
  button[disabled] { cursor:default; }
  svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; transition:fill .15s ease, stroke .15s ease; }
  button.liked { border-color:var(--heart); background:var(--tint); }
  button.liked svg { fill:var(--heart); stroke:var(--heart); }
  .count { min-width:1.5ch; font-variant-numeric:tabular-nums; }
  .label { color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<button id="btn" type="button" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
  <span class="count" id="count">–</span>
  <span class="label" id="label">喜歡這篇？按個愛心</span>
</button>

<script>
  // ── 設定 ─────────────────────────────────────────────
  var NAMESPACE = 'a-vision-of-drowl.super.site';   // 計數器命名空間（保持唯一）
  var API = 'https://abacus.jasoncameron.dev/';      // Abacus：免註冊、免金鑰
  // ────────────────────────────────────────────────────
  // Abacus 公開端點只能「加一」，所以愛心按下後不能取消。
  // 測試用：網址後面加 &reset=1 可清除這個瀏覽器的「已按過」紀錄。

  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || 'default').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').slice(0, 100);

  var btn = document.getElementById('btn');
  var countEl = document.getElementById('count');
  var labelEl = document.getElementById('label');
  var likedKey = 'heart:' + NAMESPACE + ':' + id;
  var countKey = 'heartcount:' + NAMESPACE + ':' + id;

  function store(op, key, val) {
    try {
      if (op === 'get') return localStorage.getItem(key);
      if (op === 'set') localStorage.setItem(key, val);
      if (op === 'del') localStorage.removeItem(key);
    } catch (e) {}
    return null;
  }

  if (params.get('reset') === '1') { store('del', likedKey); store('del', countKey); }

  var liked = store('get', likedKey) === '1';
  var cached = store('get', countKey);
  var count = cached === null ? null : (Number(cached) || 0);   // null = 還不知道
  var busy = false, errorText = '';

  function url(action) {
    return API + action + '/' + encodeURIComponent(NAMESPACE) + '/' + encodeURIComponent(id);
  }
  function shown() {
    if (count === null) return liked ? 1 : null;
    return liked ? Math.max(count, 1) : count;   // 已按過的人，至少看得到自己的那一顆
  }
  function paint() {
    var n = shown();
    btn.classList.toggle('liked', liked);
    btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
    btn.disabled = liked;
    countEl.textContent = n === null ? '–' : n;
    labelEl.textContent = errorText || (liked ? '謝謝你的愛心' : '喜歡這篇？按個愛心');
  }

  // 讀取目前愛心數：加上時間參數避免讀到被暫存的舊結果；404 代表還沒有人按過
  fetch(url('get') + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) return { value: 0 };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      if (busy) return;                      // 正在送出愛心時，不要被舊結果蓋掉
      count = Number(d.value) || 0;
      store('set', countKey, count);
      paint();
    })
    .catch(function () { paint(); });

  btn.addEventListener('click', function () {
    if (busy || liked) return;
    // 先立刻更新畫面，不等伺服器回應
    busy = true; errorText = '';
    var before = count;
    liked = true;
    count = (count === null ? 0 : count) + 1;
    store('set', likedKey, '1');
    paint();

    fetch(url('hit') + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (typeof d.value === 'number') count = d.value;
        store('set', countKey, count);
      })
      .catch(function (e) {
        // 送出失敗：還原，並顯示錯誤原因
        liked = false; count = before;
        store('del', likedKey);
        errorText = '送出失敗（' + (e && e.message && e.message.indexOf('HTTP') === 0 ? e.message : '連線被擋或中斷') + '），請再按一次';
      })
      .then(function () { busy = false; paint(); });
  });

  paint();
</script>
</body>
</html>
